version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend.Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./history.db:/app/history.db
    restart: unless-stopped
    networks:
      - factcheck-net

  frontend:
    build:
      context: .
      dockerfile: frontend.Dockerfile
    ports:
      - "3000:3000"
    restart: unless-stopped
    networks:
      - factcheck-net

networks:
  factcheck-net:
    driver: bridge
